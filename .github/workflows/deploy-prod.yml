name: deploy-prod

on:
  push:
    tags: ['v*']

permissions:
  id-token: write
  contents: read

concurrency: deploy-prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production # manual approval gate configured in GitHub
    env:
      AWS_REGION: us-east-1
      SITE_URL: https://gravv.keliiconsulting.com
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - name: Apply migrations first (backward compatible with the running API)
        run: supabase db push --db-url "${{ secrets.PROD_DB_URL }}"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: infra/cdk/pnpm-lock.yaml }
      - name: Deploy the stack (builds and publishes the API image, rolls api and worker)
        run: cd infra/cdk && pnpm install --frozen-lockfile && pnpm exec cdk deploy -c env=prod --require-approval never
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: apps/web/pnpm-lock.yaml }
      - name: Build the web app
        env:
          VITE_SUPABASE_URL: ${{ vars.PROD_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.PROD_SUPABASE_PUBLISHABLE_KEY }}
          VITE_API_URL: ${{ env.SITE_URL }}
        run: cd apps/web && pnpm install --frozen-lockfile && pnpm build
      - name: Publish the SPA
        run: |
          aws s3 sync apps/web/dist "s3://${{ vars.PROD_SITE_BUCKET }}" --delete --exclude index.html --exclude "*.webmanifest" --exclude sw.js --cache-control "public, max-age=31536000, immutable"
          aws s3 cp apps/web/dist/index.html "s3://${{ vars.PROD_SITE_BUCKET }}/index.html" --cache-control "no-cache"
          for f in sw.js manifest.webmanifest; do [ -f "apps/web/dist/$f" ] && aws s3 cp "apps/web/dist/$f" "s3://${{ vars.PROD_SITE_BUCKET }}/$f" --cache-control "no-cache"; done
          aws cloudfront create-invalidation --distribution-id "${{ vars.PROD_DISTRIBUTION_ID }}" --paths "/index.html" "/" "/sw.js" "/manifest.webmanifest"
      - name: Smoke test against production
        env:
          PLAYWRIGHT_BASE_URL: ${{ env.SITE_URL }}
          SMOKE_API_URL: ${{ env.SITE_URL }}
        run: cd apps/web && pnpm exec playwright install --with-deps chromium && pnpm exec playwright test e2e/smoke.spec.ts
